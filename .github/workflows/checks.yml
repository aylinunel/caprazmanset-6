name: Pipeline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Offline pipeline tests (no network, no database)
        working-directory: pipeline
        run: python -m unittest discover -s tests -v
